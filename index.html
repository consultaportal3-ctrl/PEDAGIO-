<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Carregando</title>
    <style>
      html, body { margin: 0; width: 100%; min-height: 100%; background: #000; }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000;
      }
      .splash-logo {
        display: block;
        width: min(360px, 80vw, 80vh);
        height: auto;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
    <script src="./splash-config.js?v=2"></script>
    <script src="./splash.js" defer></script>
  </head>
  <body>
    <main class="splash" role="status" aria-live="polite" aria-busy="true">
      <img class="splash-logo" src="./index_files/light-1x.png" width="288" height="288" alt="" aria-hidden="true">
      <span class="sr-only">Carregando, aguarde…</span>
    </main>
  </body>
</html>
