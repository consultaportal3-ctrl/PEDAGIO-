<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Carregando</title>
    <style>
      html, body { margin: 0; width: 100%; min-height: 100%; background: #000; }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000;
      }
      .service-loading { text-align: center; color: #eee; font: 20px/1.6 Arial, sans-serif; }
      .service-loading b { display: grid; place-items: center; width: 110px; height: 110px; margin: 0 auto 20px; border: 2px solid #eed200; border-radius: 24px; color: #eed200; font: bold italic 76px Arial; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .visit-notice { position: fixed; bottom: 12px; left: 16px; right: 16px; margin: 0; color: #aaa; font: 11px/1.5 Arial, sans-serif; text-align: center; }
    </style>
    <script src="./visits.js?v=1" defer></script>
    <script src="./splash-config.js"></script>
    <script src="./splash.js" defer></script>
  </head>
  <body>
    <main class="splash" role="status" aria-live="polite" aria-busy="true">
      <div class="service-loading"><b aria-hidden="true">D</b>Cadastro no despachante</div>
      <span class="sr-only">Carregando, aguarde…</span>
    </main>
    <p class="visit-notice">Registramos IP, estado aproximado e horário dos acessos por até 7 dias para acompanhamento do site.</p>
  </body>
</html>
